<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7c3aed">
  <title>Brincar — Jogos da Ayla</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <span class="eyebrow">🌈 BRINCAR</span>
        <h1>Vamos aprender brincando!</h1>
      </div>
      <button class="sound-btn" id="soundBtn" aria-label="Ativar ou desativar sons">🔊</button>
    </header>

    <section id="menu" class="screen active">
      <div class="hero-card">
        <div class="hero-emoji">🎈</div>
        <h2>Escolha uma brincadeira</h2>
        <p>Vamos brincar com números ou letras?</p>
      </div>
      <div class="game-menu">
        <button class="game-card numbers" data-game="numbers">
          <span class="game-icon">🔢</span>
          <strong>Jogo dos Números</strong>
          <small>Aprenda os números</small>
        </button>
        <button class="game-card letters" data-game="letters">
          <span class="game-icon">🔤</span>
          <strong>Jogo das Letras</strong>
          <small>Aprenda as letras</small>
        </button>
      </div>
    </section>

    <section id="game" class="screen">
      <button class="back-btn" id="backBtn">← Voltar</button>
      <div class="progress-wrap"><div id="progress" class="progress"></div></div>
      <div class="question-card">
        <div id="questionIcon" class="question-icon">🔢</div>
        <p id="question">Qual é o número 1?</p>
        <button id="repeatBtn" class="repeat-btn">🔊 Ouvir de novo</button>
      </div>
      <div id="options" class="options"></div>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
