<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7c3aed"><title>Jogo 16 — Teste de Voz</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#f5f3ff,#eff6ff);color:#241044;min-height:100vh}.wrap{max-width:620px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{border:0;border-radius:14px;padding:12px 15px;background:#fff;font-size:16px;font-weight:800;box-shadow:0 4px 14px #0001}.card{background:#fff;border-radius:28px;padding:24px 18px;box-shadow:0 12px 35px #0002;text-align:center}.badge{font-weight:900;letter-spacing:.5px}.emoji{font-size:72px;margin:12px 0}.phrase{font-size:clamp(2rem,9vw,3.5rem);font-weight:900;margin:10px 0 22px}.count{font-size:14px;font-weight:800;opacity:.65}.voices{display:grid;gap:12px;margin-top:18px}.voice{width:100%;border:0;border-radius:20px;padding:17px;background:#f3f4f6;font-size:18px;font-weight:850;text-align:left;cursor:pointer}.voice small{display:block;font-weight:500;opacity:.7;margin-top:4px;word-break:break-word}.voice:active{transform:scale(.98)}.voice:disabled{opacity:.65}.status{min-height:24px;margin-top:14px;font-weight:700}.hint{font-size:14px;opacity:.65;margin-top:14px;line-height:1.4}.empty{padding:16px;border-radius:18px;background:#fff3cd;color:#664d03;font-weight:700}
</style></head>
<body><main class="wrap"><div class="top"><button class="back" id="back">← Voltar</button><div class="badge">🎙️ JOGO 16 — TESTE DE VOZ</div></div><section class="card"><div class="emoji">🗣️</div><div class="phrase">“Parabéns, Ayla!”</div><p>Escolha uma voz abaixo para ouvir o teste.</p><div id="count" class="count"></div><div id="voices" class="voices"></div><div id="status" class="status"></div><div class="hint">Aqui aparecem todas as vozes que o navegador disponibilizar neste aparelho, de qualquer idioma. O jogo não limita a português nem a apenas 4 vozes.</div></section></main>
<script>
const synth=window.speechSynthesis;const box=document.getElementById('voices');const status=document.getElementById('status');const count=document.getElementById('count');
function getVoices(){return synth?synth.getVoices():[]}
function render(){const all=getVoices().slice().sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:'base'}));box.innerHTML='';count.textContent=all.length?`${all.length} voz(es) disponibilizada(s) pelo aparelho`:'Carregando as vozes...';if(!all.length){box.innerHTML='<div class="empty">O navegador ainda não disponibilizou as vozes. Aguarde alguns segundos.</div>';return}all.forEach((v,i)=>{const b=document.createElement('button');b.className='voice';b.innerHTML=`🔊 ${i+1}. ${escapeHtml(v.name)}${v.default?' ⭐':''}<small>${escapeHtml(v.lang)}${v.localService?' — voz local':' — voz remota'}</small>`;b.onclick=()=>speak(v,b) ;box.appendChild(b)})}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function speak(v,b){synth.cancel();status.textContent='';const u=new SpeechSynthesisUtterance('Parabéns, Ayla!');u.voice=v;u.lang=v.lang;u.rate=.84;u.pitch=1.05;u.onstart=()=>{status.textContent='🔊 Reproduzindo...';b.disabled=true};u.onend=()=>{status.textContent='Pronto. Toque em outra voz para comparar.';b.disabled=false};u.onerror=()=>{status.textContent='Não foi possível reproduzir esta voz neste aparelho.';b.disabled=false};synth.speak(u)}
document.getElementById('back').onclick=()=>history.length>1?history.back():location.href='index.html';render();if(synth&&'onvoiceschanged' in synth)synth.onvoiceschanged=render;setTimeout(render,500);setTimeout(render,1500);setTimeout(render,3000);
</script></body></html>
