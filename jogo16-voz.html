<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7c3aed"><title>Jogo 16 — Teste de Voz</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#f5f3ff,#eff6ff);color:#241044;min-height:100vh}.wrap{max-width:620px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{border:0;border-radius:14px;padding:12px 15px;background:#fff;font-size:16px;font-weight:800;box-shadow:0 4px 14px #0001}.card{background:#fff;border-radius:28px;padding:24px 18px;box-shadow:0 12px 35px #0002;text-align:center}.badge{font-weight:900;letter-spacing:.5px}.emoji{font-size:72px;margin:12px 0}.phrase{font-size:clamp(2rem,9vw,3.5rem);font-weight:900;margin:10px 0 22px}.voices{display:grid;gap:12px;margin-top:18px}.voice{width:100%;border:0;border-radius:20px;padding:17px;background:#f3f4f6;font-size:18px;font-weight:850;text-align:left;cursor:pointer}.voice small{display:block;font-weight:500;opacity:.7;margin-top:4px}.voice:active{transform:scale(.98)}.status{min-height:24px;margin-top:14px;font-weight:700}.hint{font-size:14px;opacity:.65;margin-top:14px;line-height:1.4}.empty{padding:16px;border-radius:18px;background:#fff3cd;color:#664d03;font-weight:700}
</style></head>
<body><main class="wrap"><div class="top"><button class="back" id="back">← Voltar</button><div class="badge">🎙️ JOGO 16 — TESTE DE VOZ</div></div><section class="card"><div class="emoji">🗣️</div><div class="phrase">“Parabéns, Ayla!”</div><p>Escolha uma voz abaixo para ouvir o teste.</p><div id="voices" class="voices"></div><div id="status" class="status"></div><div class="hint">As opções mostradas são as vozes que o navegador disponibiliza neste aparelho. O site não chama nenhuma delas de Charon.</div></section></main>
<script>
const synth=window.speechSynthesis;const box=document.getElementById('voices');const status=document.getElementById('status');
function getVoices(){return synth?synth.getVoices().filter(v=>/^pt-BR$/i.test(v.lang)||/^pt_BR$/i.test(v.lang)||/^pt-BR/i.test(v.lang)):[]}
function score(v){const n=v.name.toLowerCase();let s=0;if(/pt.?br|brazil|brasil/.test(n))s+=20;if(/male|mascul|homem|man|male/.test(n))s+=30;if(/google|microsoft|natural|neural|enhanced|premium/.test(n))s+=10;return s}
function render(){const all=getVoices().sort((a,b)=>score(b)-score(a));const chosen=[];for(const v of all){if(!chosen.some(x=>x.name===v.name))chosen.push(v);if(chosen.length>=4)break}box.innerHTML='';if(!chosen.length){box.innerHTML='<div class="empty">Nenhuma voz em português do Brasil foi disponibilizada pelo navegador neste momento. Tente novamente em alguns segundos.</div>';return}chosen.forEach((v,i)=>{const b=document.createElement('button');b.className='voice';b.innerHTML=`🔊 Voz ${i+1}<small>${v.name} — ${v.lang}</small>`;b.onclick=()=>speak(v,b);box.appendChild(b)})}
function speak(v,b){synth.cancel();status.textContent='';const u=new SpeechSynthesisUtterance('Parabéns, Ayla!');u.voice=v;u.lang=v.lang;u.rate=.84;u.pitch=1.05;u.onstart=()=>{status.textContent='🔊 Reproduzindo...';b.disabled=true};u.onend=()=>{status.textContent='Pronto. Toque em outra voz para comparar.';b.disabled=false};u.onerror=()=>{status.textContent='Não foi possível reproduzir esta voz neste aparelho.';b.disabled=false};synth.speak(u)}
document.getElementById('back').onclick=()=>history.length>1?history.back():location.href='index.html';render();if('onvoiceschanged' in synth)synth.onvoiceschanged=render;setTimeout(render,500);setTimeout(render,1500);
</script></body></html>
